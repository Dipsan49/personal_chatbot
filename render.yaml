services:
  - type: web
    name: ask-dipsan
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_CHAT_MODEL
        value: gpt-oss:20b
      - key: OLLAMA_EMBEDDING_MODEL
        value: ""
      - key: RESUME_CONTENT
        sync: false
